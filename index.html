<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIGIS スクリプト</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B57D0'/%3E%3Ccircle cx='16' cy='20.5' r='7.6' fill='none' stroke='%23F3C64B' stroke-width='2.6'/%3E%3Cpath d='M11 8.4 13.2 5.5h5.6L21 8.4 16 13.4z' fill='%23D3E3FD' stroke='%23ffffff' stroke-width='1' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Googleドキュメント風: 薄いグレーの作業面に白いページ。上にツールバー、右に撮影履歴(コメント欄の位置)。ライトテーマ固定 */
:root{
  --bg:#F9FBFD; --surface:#FFFFFF; --chrome:#EDF2FA; --ink:#1F1F1F; --muted:#5F6368; --rule:#DADCE0;
  --accent:#0B57D0; --accent-ink:#FFFFFF; --accent-soft:#D3E3FD; --hover:rgba(68,71,70,.08);
  --red:#D93025; --ok:#188038; --warn:#E37400;
  --f-ui:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif;
  --f-script:var(--f-ui);
  --top-h:60px;
  color-scheme:light;
}
@property --bk{syntax:'<number>';inherits:true;initial-value:1}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:30;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;flex:none}
.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--accent)}
.logo svg{width:30px;height:30px;color:#F3C64B}
.brand .name{font-size:18px;line-height:1.1;letter-spacing:.02em}
.brand .name b{font-weight:500}
.title-in{min-width:0;flex:1;max-width:520px;font-size:18px;border:1px solid transparent;border-radius:6px;background:transparent;padding:3px 8px;text-overflow:ellipsis}
.title-in:hover{border-color:var(--rule)}
.title-in:focus{border-color:var(--accent);outline:none;background:#fff}
.flex1{flex:1}
.top-right{display:flex;align-items:center;gap:10px;flex:none}
.peers{display:flex;align-items:center;border:0;background:none;padding:2px 4px;border-radius:999px}
.peers:hover{background:var(--hover)}
.av{width:30px;height:30px;border-radius:50%;border:2px solid var(--bg);background:var(--rule);object-fit:cover;display:block}
.peers .av+.av,.peers .more{margin-left:-8px}
.peers .more{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--rule);border:2px solid var(--bg)}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.sync .dot{width:8px;height:8px;border-radius:50%;background:#9AA0A6}
.sync.ok .dot{background:var(--ok)}
.sync.warn{color:var(--warn)} .sync.warn .dot{background:var(--warn)}
.popover{position:fixed;z-index:60;top:calc(var(--top-h) + 4px);right:12px;width:min(340px,calc(100vw - 24px));background:#fff;border-radius:12px;box-shadow:0 2px 6px 2px rgba(60,64,67,.15),0 1px 2px rgba(60,64,67,.3);padding:12px}
.popover h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:500}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.plist li{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center}
.plist .av{width:32px;height:32px;border:0}
.plist .nm{font-weight:500;font-size:14px;line-height:1.3}
.plist .sub{font-size:12px;color:var(--muted);line-height:1.3}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--chrome);white-space:nowrap}
.pill.on{color:var(--ok);background:#E6F4EA} .pill.idle{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 16px;border-radius:999px;border:1px solid var(--rule);background:#fff;font-weight:500;font-size:14px;white-space:nowrap;color:var(--accent)}
.btn:hover{background:#F6F9FE}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0A4DBA}
.btn.text{border-color:transparent;background:transparent}
.btn.text:hover{background:var(--hover)}
.btn.small{min-height:28px;padding:0 10px;font-size:12.5px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{width:18px;height:18px;flex:none}

/* ---------- home ---------- */
.home{max-width:1000px;margin:0 auto;padding:20px 16px 60px;display:grid;gap:18px}
.home-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.home-head h1{margin:0;font-size:22px;font-weight:500}
.home-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.home-actions{display:flex;flex-wrap:wrap;gap:8px}
.gdoc{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.gdoc label{display:flex;align-items:center;gap:8px;font-weight:500;font-size:14px}
.gdoc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.gdoc input{min-height:40px;border:1px solid var(--rule);border-radius:8px;padding:0 12px;font-size:15px;min-width:0}
.gdoc input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.gdoc-hint{font-size:12px;color:var(--muted)}
.drop{border:1.5px dashed var(--rule);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:13px;background:#fff}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.cards{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--rule);border-radius:8px;overflow:hidden;cursor:pointer;display:grid}
.card:hover{border-color:var(--accent)}
.thumb{height:150px;background:var(--bg);border-bottom:1px solid var(--rule);padding:14px 18px 0;overflow:hidden}
.thumb div{background:#fff;height:100%;box-shadow:0 1px 3px rgba(60,64,67,.2);padding:10px 12px;font-family:var(--f-script);font-size:8.5px;line-height:1.7;color:#444;white-space:pre-wrap;overflow:hidden}
.card .cb{padding:10px 12px 10px;display:grid;gap:4px}
.card h2{margin:0;font-size:14px;font-weight:500;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.card .meta .av{width:18px;height:18px;border:0}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:6px}
.empty{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:28px 18px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty p{margin:0;color:var(--muted)}
.notice{background:#FEF7E0;border:1px solid #F9E3A6;border-radius:8px;padding:10px 14px;font-size:13px}
.loading{padding:60px 16px;text-align:center;color:var(--muted)}

/* ---------- toolbar ---------- */
.tbar{position:sticky;top:var(--top-h);z-index:25;margin:0 12px;background:var(--chrome);border-radius:24px;min-height:42px;display:flex;align-items:center;gap:2px;padding:3px 8px;overflow-x:auto;scrollbar-width:none}
.tbar::-webkit-scrollbar{display:none}
.tb{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:0;border-radius:6px;background:none;font-size:13px;color:var(--ink);white-space:nowrap}
.tb:hover{background:var(--hover)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:#041E49}
.tb:disabled{opacity:.4;cursor:default}
.tb .u{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-family:Arial,sans-serif;font-size:15px}
.tb .eicon{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:4px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700}
.sep{width:1px;height:20px;background:#C7C7C7;margin:0 6px;flex:none}
.prog{display:flex;align-items:center;gap:8px;padding:0 6px;font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{width:110px;height:6px;border-radius:999px;background:#D7DBE0;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-done{background:var(--ok)} .bar .b-part{background:var(--warn)}
.prog b{color:var(--ink);font-size:13px}

/* ---------- document ---------- */
.work{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;align-items:start}
.canvas{min-width:0;padding:18px 12px 120px;overflow-x:hidden}
.page{max-width:816px;margin:0 auto;background:#fff;border:1px solid #E1E3E1;box-shadow:0 1px 3px rgba(60,64,67,.08);min-height:900px;padding:64px 72px 96px}
.edit-hint{max-width:816px;margin:0 auto 10px;background:#E8F0FE;color:#174EA6;border-radius:8px;padding:8px 14px;font-size:12.5px}
.paper{font-family:var(--f-script);font-size:var(--fs,17px);color:#1F1F1F;position:relative}
.paper ::selection{background:#B4D3FB}
::highlight(aigis-sel){background-color:#C9DDFB}
.p{position:relative;padding:2px 0 2px 0;margin:0}
.p::before{content:"";position:absolute;left:-22px;top:.55em;bottom:.55em;width:3px;border-radius:2px;background:transparent}
.p.st-none::before{background:#E8A49F} .p.st-part::before{background:#F6C26B} .p.st-done::before{background:#7CC495}
.pt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:calc(1.95em + var(--n,0) * 6px);min-height:1.95em}
.t-s .pt{font-family:var(--f-ui);font-weight:700;font-size:.92em;margin-top:.9em}
.t-a .pt{padding-left:2.2em;color:#3C4043}
.t-d .pt{padding-left:0}
.spk{font-family:var(--f-ui);font-weight:700;font-size:.9em}
.sg{-webkit-box-decoration-break:clone;box-decoration-break:clone;background-repeat:no-repeat}
.paper.blinking .pend{color:rgba(217,48,37,var(--bk))}
.paper.blinking{animation:bk 1.8s ease-in-out infinite alternate}
@keyframes bk{from{--bk:1}to{--bk:.15}}
.er{text-decoration:underline wavy var(--red) 1.5px;text-underline-offset:.3em;text-decoration-skip-ink:none}
.p.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:rgba(11,87,208,.18)}100%{background:transparent}}
.paper.editing .pt{outline:none;border-radius:3px;cursor:text}
.paper.editing .pt:hover{background:#F8FAFD}
.paper.editing .pt:focus{background:#F1F6FE;box-shadow:0 0 0 1px #C2D7F7}
.ptags{position:absolute;right:-56px;top:.25em;display:flex;gap:2px;user-select:none;-webkit-user-select:none}
.ptag{height:18px;min-width:18px;padding:0 5px;border-radius:999px;font-family:var(--f-ui);font-size:10.5px;font-weight:700;color:#fff;display:grid;place-items:center}
.addp{margin-top:18px}
@media (prefers-reduced-motion: reduce){ .paper.blinking{animation:none} .p.flash{animation:none} }

/* ---------- selection bar / dialogs ---------- */
.selbar{position:fixed;z-index:50;display:flex;gap:2px;background:#fff;border-radius:10px;padding:4px;box-shadow:0 2px 6px 2px rgba(60,64,67,.15),0 1px 2px rgba(60,64,67,.3)}
.selbar button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;border-radius:6px;height:36px;padding:0 12px;font-size:13.5px;font-weight:500;white-space:nowrap}
.selbar button:hover{background:var(--hover)}
.selbar .u{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;font-family:Arial,sans-serif;color:var(--accent)}
.selbar kbd,.kbd{font-family:var(--f-ui);font-size:11px;color:var(--muted);font-weight:400}
.dlg{position:fixed;z-index:55;width:min(360px,calc(100vw - 16px));background:#fff;border-radius:12px;padding:14px;box-shadow:0 4px 8px 3px rgba(60,64,67,.15),0 1px 3px rgba(60,64,67,.3);display:grid;gap:10px}
.dlg h3{margin:0;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.dlg .quote{font-family:var(--f-script);font-size:14px;background:var(--bg);border-left:3px solid var(--accent);padding:4px 10px;border-radius:0 6px 6px 0;max-height:4.8em;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}
.dlg.err .quote{border-left-color:var(--red)}
.dlg label{font-size:12px;color:var(--muted)}
.dlg input,.dlg select{width:100%;min-height:44px;border:1px solid var(--rule);border-radius:8px;padding:0 12px;background:#fff;font-size:17px}
.dlg input.file{font-size:20px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.dlg input:focus,.dlg select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 1px var(--accent)}
.dlg .row{display:flex;justify-content:flex-end;gap:8px}
.dlg .sub{font-size:12px;color:var(--muted)}
.mpop{position:fixed;z-index:52;width:min(340px,calc(100vw - 16px));background:#fff;border-radius:12px;padding:10px;box-shadow:0 2px 6px 2px rgba(60,64,67,.15),0 1px 2px rgba(60,64,67,.3);display:grid;gap:6px;max-height:60vh;overflow:auto}
.mpop h4{margin:2px 4px;font-size:12px;color:var(--muted);font-weight:500}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:6px 6px;border-radius:8px}
.mrow:hover{background:var(--bg)}
.mrow.hi{background:#E8F0FE}
.mrow .cut{grid-column:2 / 4;justify-self:start;min-height:24px;padding:0 6px;font-size:12px}
.sg[data-n]{cursor:text}
.sw{display:block;width:24px;height:8px;border-radius:2px}
.mrow .f{font-weight:700;font-size:15px;letter-spacing:.03em;overflow-wrap:anywhere}
.mrow .f.none{font-weight:400;color:var(--muted);font-size:13px}
.mrow .w{grid-column:2 / 4;font-size:11.5px;color:var(--muted)}
.mrow .tn{font-size:11px;color:var(--muted);text-align:center}
.mrow .acts{display:flex;gap:2px}
.mrow.err .f{font-weight:500;font-size:13.5px}
.mrow input{min-height:34px;border:1px solid var(--accent);border-radius:6px;padding:0 8px;font-weight:700;text-transform:uppercase;width:100%}
.wrong{text-decoration:underline wavy var(--red) 1.5px;text-underline-offset:3px}

/* ---------- history (comments column) ---------- */
.hist{position:sticky;top:calc(var(--top-h) + 52px);max-height:calc(100vh - var(--top-h) - 64px);max-height:calc(100dvh - var(--top-h) - 64px);overflow:auto;padding:18px 16px 40px 4px;display:grid;gap:8px;align-content:start}
.hist h2{margin:0 0 2px;font-size:13px;font-weight:500;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.hcard{background:#fff;border-radius:8px;padding:10px 12px;box-shadow:0 1px 2px rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);display:grid;gap:4px;cursor:pointer;font-size:13px}
.hcard:hover{box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15)}
.hcard .hh{display:flex;align-items:center;gap:8px}
.hcard .hh .av{width:22px;height:22px;border:0}
.hcard .who{font-weight:500;font-size:12.5px}
.hcard .when{font-size:11.5px;color:var(--muted)}
.hcard .file{font-weight:700;font-size:15px;letter-spacing:.03em}
.hcard .q{font-family:var(--f-script);color:#3C4043;font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hcard.err{border-left:3px solid var(--red)}
.hcard.pending{outline:1px dashed var(--warn)}
.hempty{font-size:12.5px;color:var(--muted);display:grid;gap:8px;padding:4px 2px}
.legend{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;font-size:12px}

/* ---------- modal / toast ---------- */
.modal-back{position:fixed;inset:0;z-index:80;background:rgba(32,33,36,.45);display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:min(720px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 4px 8px 3px rgba(60,64,67,.15)}
.modal header{padding:18px 20px 8px}
.modal header h2{margin:0;font-size:18px;font-weight:500}
.modal header p{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.modal .body{padding:8px 20px 14px;overflow:auto;display:grid;gap:12px}
.modal footer{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.field{display:grid;gap:4px}
.field label{font-size:12px;color:var(--muted)}
.field input[type=text]{min-height:42px;border:1px solid var(--rule);border-radius:8px;padding:0 12px;font-size:16px}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.pv{border:1px solid var(--rule);border-radius:8px;font-family:var(--f-script);font-size:13.5px;max-height:44vh;overflow:auto;padding:12px 16px;white-space:pre-wrap;line-height:1.8}
.pv .s{font-family:var(--f-ui);font-weight:700}
.pv .d b{font-family:var(--f-ui)}
.pv .a{padding-left:2em;color:#5F6368}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px}
.csvbox{width:100%;min-height:180px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--rule);border-radius:8px;background:var(--bg);padding:8px}
#toasts{position:fixed;z-index:90;left:16px;bottom:16px;display:grid;gap:8px;width:min(440px,calc(100vw - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:#303030;color:#F2F2F2;border-radius:6px;padding:10px 10px 10px 16px;font-size:13.5px;box-shadow:0 3px 5px -1px rgba(0,0,0,.2),0 6px 10px rgba(0,0,0,.14)}
.toast .msg{flex:1;min-width:0}
.toast.err{background:#8C1D18}
.toast button{border:0;background:none;color:#A8C7FA;border-radius:4px;padding:5px 8px;font-weight:500;font-size:13px}
.toast button:hover{background:rgba(255,255,255,.08)}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .work{display:block}
  .hist{position:fixed;z-index:45;top:var(--top-h);right:0;bottom:0;width:min(340px,90vw);max-height:none;background:var(--bg);box-shadow:-4px 0 16px rgba(0,0,0,.12);padding:16px;transform:translateX(105%);transition:transform .2s}
  .hist.open{transform:none}
  .ptags{right:-14px;top:-12px}
}
@media (min-width:1181px){ #histBtn{display:none} .hist .closeh{display:none} }
@media (max-width:760px){
  :root{--top-h:54px}
  .top{gap:8px;padding:0 10px}
  .brand .name{display:none}
  .title-in{font-size:16px}
  .sync #syncText{display:none}
  .tbar{margin:0 6px}
  .tb .lbl{display:none}
  .canvas{padding:10px 0 120px}
  .page{border:0;box-shadow:none;padding:20px 18px 80px;min-height:0}
  .p::before{left:-12px}
  .t-a .pt{padding-left:1.2em}
  .prog .bar{width:60px}
  .edit-hint{margin:0 10px 8px}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#" id="homeLink" aria-label="AIGIS スクリプト ホーム">
    <span class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="20.5" r="7.6" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M11 8.4 13.2 5.5h5.6L21 8.4 16 13.4z" fill="#D3E3FD" stroke="#fff" stroke-width="1" stroke-linejoin="round"/><path d="M11 8.4h10M13.2 5.5 16 13.4l2.8-7.9" fill="none" stroke="#fff" stroke-width=".7" stroke-linejoin="round" opacity=".85"/></svg></span>
    <span class="name">AIGIS <b>スクリプト</b></span>
  </a>
  <input class="title-in" id="titleIn" aria-label="台本のタイトル" hidden maxlength="80">
  <span class="flex1"></span>
  <div class="top-right">

<script>
(() => {
'use strict';

/* =====================================================================
   Constants & helpers
   ===================================================================== */
const DONE_AT = 3;                         // 3テイク以上で撮影完了
const BAND = 5, GAP = 1;                   // アンダーラインの太さと間隔(px)
const BASE_RGB = [[255,214,10],[255,120,190],[64,220,140],[70,180,255],[255,150,50],[170,130,255]];
const IGN = /[\s「」『』、。，．,.…‥・！？!?（）()―─〜~"“”'’]/;   // 撮影判定・点滅の対象外の文字
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const MAMMOTH = 'https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(_){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(_){ return false; } }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({code:'timeout'}), ms))]); }
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);

/* テイク番号(0始まり) → 蛍光ペンの色。1〜6本目は固定色、7本目以降は黄金角で色相を回して自動生成 */
function takeColor(i, a = .85){
  if (i < BASE_RGB.length){ const [r,g,b] = BASE_RGB[i]; return `rgba(${r},${g},${b},${a})`; }
  const h = Math.round((i * 137.508 + 52) % 360);
  return `hsla(${h},92%,62%,${a})`;
}
function markStyle(n){
  if (!n) return '';
  const imgs = [], pos = [];
  for (let i = 0; i < n; i++){ const c = takeColor(i); imgs.push(`linear-gradient(${c},${c})`); pos.push(`0 calc(100% - ${(n - 1 - i) * (BAND + GAP)}px)`); }
  return `padding-bottom:${n * (BAND + GAP)}px;background-image:${imgs.join(',')};background-position:${pos.join(',')};background-size:${Array(n).fill('100% ' + BAND + 'px').join(',')}`;
}
function detectDevice(){
  const ua = navigator.userAgent;
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'iPad';
  if (/iPhone|iPod/.test(ua)) return 'iPhone';
  if (/Android/.test(ua)) return /Mobile/.test(ua) ? 'Android' : 'Androidタブレット';
  return 'PC';
}
const DEVICE = detectDevice();
function fmtTime(ms){
  const d = new Date(ms), now = new Date();
  const hm = d.toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'});
  return d.toDateString() === now.toDateString() ? hm : `${d.getMonth()+1}/${d.getDate()} ${hm}`;
}
function fmtDate(ms){ const d = new Date(ms); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`; }
function nextFileName(prev){
  if (!prev) return 'C0001';
  const m = /^(.*?)(\d+)(\D*)$/.exec(prev);
  if (!m) return prev;
  return m[1] + String(parseInt(m[2], 10) + 1).padStart(m[2].length, '0') + m[3];
}
const normFile = s => String(s || '').trim().replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).toUpperCase().slice(0, 60);
const clip = (s, n) => { s = String(s || '').replace(/\n/g, ' '); return s.length > n ? s.slice(0, n) + '…' : s; };

/* =====================================================================
   Script parser
   ===================================================================== */
const SCENE_RE = /^\s*(?:[○◯〇●■□◆◇#＃]|[SsＳｓ]\s*[#＃\-－]?\s*[0-9０-９]|シーン\s*[0-9０-９]|SCENE\b|INT\.|EXT\.|[0-9０-９]+\s*[\.．]\s*(?:INT|EXT))/i;
const DLG_BRACKET = /^\s*([^\s「『：:（(]{1,12}(?:\s*[（(][^）)]{0,12}[）)])?)\s*([「『][\s\S]*)$/;
const DLG_COLON = /^\s*([^\s「『：:（(]{1,10}(?:\s*[（(][^）)]{0,12}[）)])?)\s*[：:]\s*(\S[\s\S]*)$/;
function closesBracket(s){ return (s.match(/[」』]/g) || []).length >= (s.match(/[「『]/g) || []).length; }
/* 取り込み時: 原稿テキスト → 段落の配列 [{id, x}] (セリフの続き行は1段落にまとめる) */
function parseScript(raw){
  const src = String(raw || '').replace(/\r\n?/g, '\n').replace(/[​﻿]/g, '').split('\n');
  const out = []; let open = null;
  for (const rawLine of src){
    const t = rawLine.replace(/[ \t　]+$/g, '').trim();
    if (open){
      if (!t) open = null;
      else { open.x += '\n' + t; if (closesBracket(open.x)) open = null; continue; }
    }
    if (!t){ if (out.length && out[out.length-1].x !== '') out.push({x:''}); continue; }
    if (/^[「『]/.test(t)){
      const prev = out[out.length-1];
      if (prev && prev.x && prev.x.length <= 12 && !/[。、！？!?「」]/.test(prev.x) && !SCENE_RE.test(prev.x)){ prev.x += t; if (!closesBracket(prev.x)) open = prev; continue; }
    }
    const p = {x:t}; out.push(p);
    if (/[「『]/.test(t) && classify(t).type === 'd' && !closesBracket(t)) open = p;
  }
  while (out.length && out[out.length-1].x === '') out.pop();
  while (out.length && out[0].x === '') out.shift();
  out.forEach((l, i) => { l.id = 'L' + String(i + 1).padStart(4, '0'); });
  return out;
}
/* 段落の種類(シーン / セリフ / ト書き / 空行)と、セリフ本文が始まる位置 d0 */
function classify(x){
  const t = x.trim();
  if (!t) return {type:'b', d0:0, sp:''};
  if (SCENE_RE.test(t) && t.length <= 80 && !t.includes('\n')) return {type:'s', d0:0, sp:''};
  let m = DLG_BRACKET.exec(x);
  if (m) return {type:'d', d0:x.length - m[2].length, sp:m[1].trim()};
  if (/^\s*[「『]/.test(x)) return {type:'d', d0:x.search(/[「『]/), sp:''};
  m = DLG_COLON.exec(x);
  if (m && !/^\d/.test(m[1])) return {type:'d', d0:x.length - m[2].length, sp:m[1].trim()};
  return {type:'a', d0:0, sp:''};
}

/* =====================================================================
   File import
   ===================================================================== */
const loaded = {};
function loadScript(src){
  if (!loaded[src]) loaded[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = () => { delete loaded[src]; rej(new Error('ライブラリを読み込めませんでした。通信状態を確認してください。')); };
    document.head.appendChild(s);
  });
  return loaded[src];
}
function decodeText(buf){
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(buf);
  if (u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(buf);
  try { return new TextDecoder('utf-8', {fatal:true}).decode(buf).replace(/^﻿/, ''); }
  catch(_){ try { return new TextDecoder('shift_jis').decode(buf); } catch(__){ return new TextDecoder().decode(buf); } }
}
async function pdfToText(buf){
  await loadScript(PDFJS); await loadScript(PDFJS_WORKER);
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
  const doc = await lib.getDocument({data:new Uint8Array(buf), isEvalSupported:false}).promise;
  const lines = [];
  for (let p = 1; p <= doc.numPages; p++){
    const tc = await (await doc.getPage(p)).getTextContent();
    let cur = '', lastY = null;
    for (const it of tc.items){
      if (!('str' in it)) continue;
      const y = it.transform[5], h = Math.abs(it.transform[3]) || it.height || 10;
      if (lastY !== null && Math.abs(y - lastY) > h * 0.6 && cur){ lines.push(cur); cur = ''; }
      cur += it.str; lastY = y;
      if (it.hasEOL){ lines.push(cur); cur = ''; lastY = null; }
    }
    if (cur) lines.push(cur);
    lines.push('');
  }
  const text = lines.join('\n');
  if (!text.replace(/\s/g, '')) throw new Error('PDFから文字を取り出せませんでした(画像化されたPDFや縦書きPDFの可能性があります)。Word かテキストで取り込んでください。');
  return text;
}
async function docxToText(buf){
  await loadScript(MAMMOTH);
  return (await window.mammoth.extractRawText({arrayBuffer:buf})).value.replace(/\n\n/g, '\n');
}

/* =====================================================================
   Stores — cloud (shared db) / local (this device)
   API: watchScripts, loadBase, createScript, updateScript, deleteScript,
        watch(sid,col), add / set / update / del (sid,col,…)
   ===================================================================== */
function chunkLines(lines){
  const chunks = []; let cur = [], size = 0; const enc = new TextEncoder();
  for (const l of lines){
    const s = enc.encode(JSON.stringify(l)).length + 1;
    if (cur.length && (size + s > 150000 || cur.length >= 800)){ chunks.push(cur); cur = []; size = 0; }
    cur.push(l); size += s;
  }
  if (cur.length) chunks.push(cur);
  return chunks;
}
function mergeView(base, ops, sid, col){
  const map = new Map(base);
  for (const op of ops){
    if (op.sid !== sid || (op.col || 'takes') !== col) continue;
    if (op.op === 'add' || op.op === 'set'){ map.set(op.id, {...op.data, id:op.id, _pending:true}); }
    else if (op.op === 'update'){ const t = map.get(op.id); if (t) map.set(op.id, {...t, ...op.data, _pending:true}); }
    else if (op.op === 'delete'){ map.delete(op.id); }
  }
  return [...map.values()];
}

function CloudStore(db){
  const S = {mode:'cloud'};
  let pending = lsGet('aigis.pending', []);
  const touched = new Map(), listeners = new Set();
  let flushing = false, retryTimer = null;
  S.pendingCount = () => pending.length;
  S.onPendingChange = null; S.onWriteRefused = null;
  const savePending = () => { lsSet('aigis.pending', pending); listeners.forEach(f => f()); S.onPendingChange && S.onPendingChange(); };

  S.watchScripts = (cb, onErr) => db.collection('scripts').orderBy('createdAt', 'desc').onSnapshot(
    snap => cb(snap.docs.map(d => ({...d.data(), id:d.id})), snap.metadata), e => onErr && onErr(e));
  S.loadBase = async sid => {
    const key = 'aigis.lines.' + sid;
    try {
      const snap = await withTimeout(db.collection(`scripts/${sid}/chunks`).get(), 15000);
      const lines = snap.docs.map(d => d.data()).sort((a, b) => a.i - b.i).flatMap(d => d.lines || []);
      if (lines.length) lsSet(key, lines);
      return lines;
    } catch(e){ const c = lsGet(key, null); if (c) return c; throw e; }
  };
  S.createScript = async (meta, lines) => {
    const sid = newId(), chunks = chunkLines(lines);
    for (let i = 0; i < chunks.length; i++) await db.doc(`scripts/${sid}/chunks/c${i}`).set({i, lines:chunks[i]});
    await db.doc(`scripts/${sid}`).set({...meta, chunks:chunks.length});
    lsSet('aigis.lines.' + sid, lines);
    return sid;
  };
  S.updateScript = (sid, patch) => db.doc(`scripts/${sid}`).update(patch);
  S.deleteScript = async sid => {
    await db.doc(`scripts/${sid}`).delete();
    try {
      const cols = ['chunks', 'takes', 'errs', 'paras'];
      const snaps = await Promise.all(cols.map(c => db.collection(`scripts/${sid}/${c}`).get()));
      for (const p of snaps.flatMap((s, i) => s.docs.map(d => `scripts/${sid}/${cols[i]}/${d.id}`))){ await db.doc(p).delete(); await sleep(60); }
    } catch(_){}
  };
  S.watch = (sid, col, cb, onStatus) => {
    let base = new Map(), baseline = false;
    const emit = changes => cb(mergeView(base, pending, sid, col), changes);
    const relisten = () => emit([]);
    listeners.add(relisten);
    const key = `aigis.${col}.${sid}`;
    const cached = lsGet(key, null);
    if (cached){ base = new Map(cached.map(t => [t.id, t])); setTimeout(() => emit([])); }
    const unsub = db.collection(`scripts/${sid}/${col}`).onSnapshot(snap => {
      base = new Map(snap.docs.map(d => [d.id, {...d.data(), id:d.id}]));
      let changes = [];
      if (baseline){
        changes = snap.docChanges().filter(c => !c.doc.metadata.hasPendingWrites)
          .filter(c => { const t = touched.get(c.doc.id); return !(t && Date.now() - t < 20000); })
          .map(c => ({type:c.type, doc:{...c.doc.data(), id:c.doc.id}}));
      }
      if (!snap.metadata.fromCache){ baseline = true; lsSet(key, [...base.values()]); }
      onStatus && onStatus(snap.metadata);
      emit(changes);
    }, e => onStatus && onStatus(null, e));
    return () => { unsub(); listeners.delete(relisten); };
  };
  function enqueue(op){
    touched.set(op.id, Date.now());
    const prev = pending.find(p => p.id === op.id && (p.op === 'add' || p.op === 'set'));
    if (op.op === 'update' && prev && pending.indexOf(prev) > 0){ prev.data = {...prev.data, ...op.data}; savePending(); flush(); return; }
    if (op.op === 'set' && prev && pending.indexOf(prev) > 0){ prev.data = op.data; savePending(); flush(); return; }
    if (op.op === 'delete' && prev && prev.op === 'add'){ pending = pending.filter(p => p.id !== op.id); savePending(); return; }
    pending.push(op); savePending(); flush();
  }
  S.add = (sid, col, data) => { const id = newId(); enqueue({op:'add', sid, col, id, data}); return id; };
  S.set = (sid, col, id, data) => enqueue({op:'set', sid, col, id, data});
  S.update = (sid, col, id, data) => enqueue({op:'update', sid, col, id, data});
  S.del = (sid, col, id) => enqueue({op:'delete', sid, col, id});
  async function flush(){
    if (flushing) return; flushing = true;
    try {
      while (pending.length){
        const op = pending[0];
        const ref = db.doc(`scripts/${op.sid}/${op.col || 'takes'}/${op.id}`);
        try {
          if (op.op === 'add' || op.op === 'set') await withTimeout(ref.set(op.data), 12000);
          else if (op.op === 'update') await withTimeout(ref.update(op.data), 12000);
          else await withTimeout(ref.delete(), 12000);
          touched.set(op.id, Date.now());
          if (pending[0] === op) pending.shift(); else pending = pending.filter(p => p !== op);
          savePending();
        } catch(e){
          const code = e && e.code;
          if (['invalid_argument','quota_exceeded','revoked','not_granted','capability_disabled','transform_error','permission-denied','invalid-argument','resource-exhausted','not-found'].includes(code)){
            pending = pending.filter(p => p !== op); savePending();
            S.onWriteRefused && S.onWriteRefused(code, op);
          } else { clearTimeout(retryTimer); retryTimer = setTimeout(flush, 8000); break; }
        }
      }
    } finally { flushing = false; }
  }
  window.addEventListener('online', () => flush());
  if (pending.length) setTimeout(flush, 500);
  return S;
}

function LocalStore(){
  const S = {mode:'local'};
  const mem = {};
  const get = (k, d) => { const v = lsGet(k, undefined); return v === undefined ? (k in mem ? mem[k] : d) : v; };
  const put = (k, v) => { if (!lsSet(k, v)) mem[k] = v; };
  const key = (col, sid) => `aigis.local.${col}.${sid}`;
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('aigis-local2') : null;
  const scriptL = new Set(), colL = new Map();
  const fireScripts = () => { const list = get('aigis.local.scripts', []).slice().sort((a, b) => b.createdAt - a.createdAt); scriptL.forEach(f => f(list)); };
  const fire = (sid, col, changes) => { (colL.get(col + ':' + sid) || new Set()).forEach(f => f(get(key(col, sid), []), changes)); };
  if (bc) bc.onmessage = e => { const m = e.data || {}; if (m.k === 'scripts') fireScripts(); if (m.k === 'col') fire(m.sid, m.col, m.changes || []); };
  S.pendingCount = () => 0;
  S.watchScripts = cb => { scriptL.add(cb); setTimeout(fireScripts); return () => scriptL.delete(cb); };
  S.loadBase = async sid => get(key('lines', sid), []);
  S.createScript = async (meta, lines) => {
    const sid = newId(); put(key('lines', sid), lines);
    put('aigis.local.scripts', [...get('aigis.local.scripts', []), {...meta, id:sid}]);
    fireScripts(); bc && bc.postMessage({k:'scripts'}); return sid;
  };
  S.updateScript = async (sid, patch) => { put('aigis.local.scripts', get('aigis.local.scripts', []).map(s => s.id === sid ? {...s, ...patch} : s)); fireScripts(); bc && bc.postMessage({k:'scripts'}); };
  S.deleteScript = async sid => {
    put('aigis.local.scripts', get('aigis.local.scripts', []).filter(s => s.id !== sid));
    try { ['lines', 'takes', 'errs', 'paras'].forEach(c => localStorage.removeItem(key(c, sid))); } catch(_){}
    fireScripts(); bc && bc.postMessage({k:'scripts'});
  };
  S.watch = (sid, col, cb, onStatus) => {
    const k = col + ':' + sid; if (!colL.has(k)) colL.set(k, new Set());
    colL.get(k).add(cb); setTimeout(() => { onStatus && onStatus({fromCache:false}); fire(sid, col, []); });
    return () => colL.get(k).delete(cb);
  };
  const mutate = (sid, col, fn, change) => { put(key(col, sid), fn(get(key(col, sid), []))); fire(sid, col, []); bc && bc.postMessage({k:'col', sid, col, changes:[change]}); };
  S.add = (sid, col, data) => { const id = newId(); S.set(sid, col, id, data); return id; };
  S.set = (sid, col, id, data) => mutate(sid, col, a => [...a.filter(t => t.id !== id), {...data, id}], {type:'added', doc:{...data, id}});
  S.update = (sid, col, id, data) => mutate(sid, col, a => a.map(t => t.id === id ? {...t, ...data} : t), {type:'modified', doc:{id, ...data}});
  S.del = (sid, col, id) => { const t = get(key(col, sid), []).find(x => x.id === id); mutate(sid, col, a => a.filter(t => t.id !== id), {type:'removed', doc:t || {id}}); };
  return S;
}

/* =====================================================================
   State
   ===================================================================== */
const state = {
  store:null, user:null, room:null, uid:null, canWrite:true, roomOn:false,
  scripts:[], scriptsReady:false,
  sid:null, meta:null,
  base:[], paraDocs:[], rawTakes:[], rawErrs:[],
  paras:[], pById:new Map(), order:new Map(),
  takes:[], errs:[], mIdx:new Map(), psig:new Map(), pstat:new Map(),
  unsubs:[], status:'wait', statusTimer:null, ready:{paras:false, takes:false, errs:false},
  editing:false, focusReq:null, saveTimers:new Map(), deferred:false,
  lastSel:null, undo:[], peers:[], profiles:{},
  blinkOn: true, fs: lsGet('aigis.fs', 17),
  homeConfirm:null, cursor:0,
};
const view = $('#view');
const paper = () => $('#paper');

/* ---------- toasts & modal ---------- */
function toast(msg, opt = {}){
  const t = document.createElement('div'); t.className = 'toast' + (opt.err ? ' err' : '');
  const m = document.createElement('div'); m.className = 'msg'; m.textContent = msg; t.appendChild(m);
  if (opt.action){ const b = document.createElement('button'); b.type = 'button'; b.textContent = opt.action; b.onclick = () => { t.remove(); opt.onAction && opt.onAction(); }; t.appendChild(b); }
  $('#toasts').appendChild(t);
  while ($('#toasts').children.length > 2) $('#toasts').firstChild.remove();
  setTimeout(() => t.remove(), opt.ms || 4500);
}
function openModal(html){
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-back"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const back = root.firstChild;
  back.addEventListener('mousedown', e => { if (e.target === back) closeModal(); });
  return back.firstChild;
}
function closeModal(){ $('#modalRoot').innerHTML = ''; }

/* ---------- people ---------- */
async function resolveProfiles(ids){
  ids = [...new Set(ids.filter(x => x && x !== 'seed' && !(x in state.profiles)))];
  if (!state.user || !ids.length) return;
  try { Object.assign(state.profiles, await state.user.profiles(ids)); } catch(_){}
}
function personName(id){
  if (!id) return state.store && state.store.mode === 'local' ? 'この端末' : '参加者';
  if (id === 'seed') return 'サンプル';
  if (id === state.uid) return state.backend === 'firebase' ? (lsGet('aigis.name', '') || 'あなた') + '(あなた)' : 'あなた';

/* GoogleドキュメントのURL → 本文(Google Drive API。Firebase の API キーを使う) */
async function importGdoc(url){
  const m = /\/document\/(?:u\/\d+\/)?d\/([A-Za-z0-9_-]{20,})/.exec(url || '') || /[?&]id=([A-Za-z0-9_-]{20,})/.exec(url || '');
  if (!m){ toast('GoogleドキュメントのURLを貼ってください(docs.google.com/document/d/… の形)', {err:true, ms:7000}); return; }
  if (!FIREBASE_CONFIG){ toast('この画面ではGoogleドキュメントを読み込めません。配布用のURL版で使ってください。', {err:true, ms:7000}); return; }
  const id = m[1], key = FIREBASE_CONFIG.apiKey, btn = $('#gdocBtn');
  btn.disabled = true; btn.textContent = '読み込み中…';
  try {
    const api = 'https://www.googleapis.com/drive/v3/files/' + id;
    const [r1, r2] = await Promise.all([fetch(`${api}/export?mimeType=text/plain&key=${key}`), fetch(`${api}?fields=name&key=${key}`)]);
    if (!r1.ok){
      let reason = '', msg = '';
      try { const j = await r1.json(); msg = (j.error && j.error.message) || ''; reason = ((j.error && j.error.errors && j.error.errors[0]) || {}).reason || (j.error && j.error.status) || ''; } catch(_){}
      if (r1.status === 404) throw new Error('ドキュメントが見つかりません。共有設定を「リンクを知っている全員」にしてください。');
      if (/accessNotConfigured|SERVICE_DISABLED|has not been used/i.test(reason + msg)) throw new Error('Google Drive API がまだ有効になっていません(管理者の設定が必要です)。');
      if (/API_KEY_SERVICE_BLOCKED|blocked/i.test(reason + msg)) throw new Error('APIキーで Google Drive API が許可されていません(管理者の設定が必要です)。');
      if (r1.status === 403) throw new Error('読み込みを許可されていません。共有設定を「リンクを知っている全員」にしてください。');
      throw new Error('読み込めませんでした(' + r1.status + ')。');
    }
    const text = await r1.text();
    let title = 'Googleドキュメント';
    try { if (r2.ok) title = (await r2.json()).name || title; } catch(_){}
    const lines = parseScript(text);
    if (!lines.some(l => l.x)) throw new Error('ドキュメントに本文が見つかりませんでした。');
    $('#gdocUrl').value = '';
    showImportPreview(title, lines, 'gdoc');
  } catch(err){ toast(err.message || '読み込みに失敗しました', {err:true, ms:9000}); }
  finally { btn.disabled = false; btn.textContent = '読み込む'; }
}

function buildParas(){

/* 旧形式のテイク(行単位)を文字範囲に変換 */
function normMark(m, kind){

  if (m.lineId){
    const p = state.pById.get(m.lineId); if (!p) return {...m, segs:[]};
    const d0 = p.inf.d0, L = p.x.length;
    if (kind === 'errs' && m.s >= 0 && m.e >= 0) return {...m, segs:[{p:m.lineId, s:d0 + m.s, e:Math.min(L, d0 + m.e + 1)}]};
    return {...m, segs:[{p:m.lineId, s:d0, e:L}]};
  }

function rebuildMarks(){
  const byTime = (a, b) => (a.at || 0) - (b.at || 0) || (a.id < b.id ? -1 : 1);
  state.takes = state.rawTakes.map(t => normMark(t, 'takes')).sort(byTime);
  state.errs = state.rawErrs.map(e => normMark(e, 'errs')).sort(byTime);
  const idx = new Map();
  const slot = p => { if (!idx.has(p)) idx.set(p, {t:[], e:[]}); return idx.get(p); };
  for (const t of state.takes) for (const s of t.segs) slot(s.p).t.push({m:t, s:s.s, e:s.e});
  for (const e of state.errs) for (const s of e.segs) slot(s.p).e.push({m:e, s:s.s, e:s.e});
  state.mIdx = idx;
}

  const ix = state.mIdx.get(p.id);
  if (ix){
    for (const r of ix.t) for (let i = Math.max(0, r.s); i < Math.min(L, r.e); i++) cov[i]++;
    for (const r of ix.e) for (let i = Math.max(0, r.s); i < Math.min(L, r.e); i++) er[i] = 1;
  }
  return {cov, er};
}
const countable = (p, i) => p.inf.type === 'd' && i >= p.inf.d0 && !IGN.test(p.x[i]);
/* セリフ段落の状態: 対象文字すべてが3テイク以上 → 完了 */
function paraStatus(p, cov){

  for (let i = p.inf.d0; i < p.x.length; i++){ if (!countable(p, i)) continue; n++; min = Math.min(min, cov[i]); if (cov[i] > 0) any = true; }
  if (!n) return null;

}

  }

    html += `<span class="${cls.join(' ')}"${n ? ` data-n="${n}" style="${markStyle(n)}"` : ''}>${esc(p.x.slice(i, j))}</span>`;
    i = j;

  return `<div class="p t-${t}${st ? ' st-' + st : ''}" data-id="${p.id}"><div class="pt" style="--n:${maxN}">${html}</div></div>`;
}

  }

/* 線(アンダーライン)の上を押したときだけ反応。セリフ間違いは赤い波線の文字を押したとき */
function hitTest(e){
  const sg = e.target.closest && e.target.closest('.sg'); if (!sg) return null;
  const n = +sg.dataset.n || 0, isErr = sg.classList.contains('er');
  const r = [...sg.getClientRects()].find(r => e.clientX >= r.left - 1 && e.clientX <= r.right + 1 && e.clientY >= r.top - 1 && e.clientY <= r.bottom + 1);
  if (!r) return null;
  const step = BAND + GAP, tol = lastPointer === 'touch' ? 12 : 3;
  const bandTop = r.bottom - n * step - tol;
  let mode = null;
  if (n && e.clientY >= bandTop) mode = 'band';
  else if (isErr && e.clientY >= r.bottom - n * step - r.height * 0.45) mode = 'err';
  if (!mode) return null;
  const c = caretAt(e.clientX, r.top + Math.min(8, r.height / 3)); if (!c) return null;
  const pos = resolvePoint(c.node, c.off, false); if (!pos) return null;
  const p = state.pById.get(pos.pid);
  const ix = state.mIdx.get(pos.pid) || {t:[], e:[]};
  let off = pos.off;
  const covers = o => (mode === 'band' ? ix.t : ix.e).some(q => q.s <= o && o < q.e);
  if (!covers(off) && off > 0 && covers(off - 1)) off -= 1;
  if (off >= p.x.length) off = p.x.length - 1;
  if (!covers(off)) return null;
  const band = mode === 'band' ? Math.max(0, Math.min(n - 1, n - 1 - Math.floor(Math.max(0, r.bottom - e.clientY) / step))) : null;
  return {ctx:{pid:pos.pid, off, band, errOnly: mode === 'err'}};
}

const PLAIN = (() => { const d = document.createElement('div'); try { d.contentEditable = 'plaintext-only'; } catch(_){ return false; } return d.contentEditable === 'plaintext-only'; })();
function setEditing(on){
  if (!on) flushAllEdits();
  state.editing = on;
  window.getSelection().removeAllRanges(); hideSelbar(); closeMpop(); closeDlg();
  $('#tbEdit').setAttribute('aria-pressed', String(on));
  $('#editHint').hidden = !on; $('#addWrap').hidden = !on;
  ['tbTake', 'tbErr'].forEach(id => $('#' + id).disabled = on);
  paper().classList.toggle('editing', on);
  paper().classList.toggle('blinking', state.blinkOn && !on);
  renderDoc(true);
  setPresence({edit:null});
}
function caretOffset(pt){
  const sel = window.getSelection(); if (!pt || !sel.rangeCount || !pt.contains(sel.focusNode)) return 0;
  return textOffset(pt, sel.focusNode, sel.focusOffset);
}
function setCaret(pt, off){
  const walker = document.createTreeWalker(pt, NodeFilter.SHOW_TEXT);
  let n, left = off;
  while ((n = walker.nextNode())){ if (left <= n.length){ const r = document.createRange(); r.setStart(n, left); r.collapse(true); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); return; } left -= n.length; }
  const r = document.createRange(); r.selectNodeContents(pt); r.collapse(false); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
const readPt = pt => pt.textContent;
function updateEditPresence(){
  const a = document.activeElement; const pn = a && a.closest && a.closest('#paper .p');
  const pid = pn ? pn.dataset.id : null;
  if (pid !== state.editPid){ state.editPid = pid; setPresence({edit:pid}); }
}
/* 文字の変更に合わせて、線とセリフ間違いの位置をずらす */
function diffMapper(a, b){
  let p = 0; while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let q = 0; while (q < a.length - p && q < b.length - p && a[a.length - 1 - q] === b[b.length - 1 - q]) q++;
  const delta = b.length - a.length;
  return i => i <= p ? i : (i >= a.length - q ? i + delta : p + Math.min(i - p, b.length - q - p));
}
function rewriteMarks(fn){
  for (const [col, list] of [['takes', state.takes], ['errs', state.errs]]){
    for (const m of list){
      if (!m.segs.some(s => fn.touches(s))) continue;
      const segs = m.segs.flatMap(s => fn.touches(s) ? fn.map(s) : [s]).filter(s => s.e > s.s);
      if (!segs.length) state.store.del(state.sid, col, m.id);
      else state.store.update(state.sid, col, m.id, {segs});
    }
  }
}
function writePara(p, x, extra = {}){
  state.store.set(state.sid, 'paras', p.id, {o:p.o, x, at:Date.now(), by:state.uid, ...extra});
}
function savePara(pid, text){
  const p = state.pById.get(pid); if (!p || p.x === text) return;
  const f = diffMapper(p.x, text);
  rewriteMarks({touches: s => s.p === pid, map: s => [{p:pid, s:f(s.s), e:f(s.e)}]});
  writePara(p, text);
}
function flushEdit(pid){
  clearTimeout(state.saveTimers.get(pid)); state.saveTimers.delete(pid);
  const pt = paper() && paper().querySelector(`.p[data-id="${pid}"] .pt`);
  if (pt && state.editing) savePara(pid, readPt(pt));
}
function flushAllEdits(){ [...state.saveTimers.keys()].forEach(flushEdit); }
/* キャレット位置 c で段落を分ける / 複数行を貼り付ける */
function splitInsert(pid, c, lines){
  flushEdit(pid);
  const p = state.pById.get(pid); if (!p) return;
  const i = state.order.get(pid), next = state.paras[i + 1];
  const before = p.x.slice(0, c), after = p.x.slice(c);
  const n = lines.length;
  const hiO = next ? next.o : p.o + 1024 * n;
  const ids = [pid, ...Array.from({length:n - 1}, () => 'p' + newId())];
  const texts = lines.map((l, k) => (k === 0 ? before : '') + l + (k === n - 1 ? after : ''));
  const lastId = ids[n - 1], shift = lines[n - 1].length - c;
  rewriteMarks({touches: s => s.p === pid && s.e > c,
    map: s => s.s >= c ? [{p:lastId, s:s.s + shift, e:s.e + shift}] : [{p:pid, s:s.s, e:c}, {p:lastId, s:lines[n - 1].length, e:s.e + shift}]});
  state.focusReq = {id:lastId, off:lines[n - 1].length};
  writePara(p, texts[0]);
  for (let k = 1; k < n; k++) state.store.set(state.sid, 'paras', ids[k], {o:p.o + (hiO - p.o) * k / n, x:texts[k], at:Date.now(), by:state.uid});
}
function mergeUp(pid){
  flushEdit(pid);
  const i = state.order.get(pid); if (!i) return;
  const prev = state.paras[i - 1], cur = state.paras[i];
  flushEdit(prev.id);
  const L = prev.x.length;
  state.focusReq = {id:prev.id, off:L};
  rewriteMarks({touches: s => s.p === cur.id, map: s => [{p:prev.id, s:s.s + L, e:s.e + L}]});
  writePara(prev, prev.x + cur.x);
  writePara(cur, '', {del:true});
  state.focusReq = {id:prev.id, off:L};
  renderDoc(false);
}
function addParaEnd(){
  const last = state.paras[state.paras.length - 1];
  const id = 'p' + newId();
  state.focusReq = {id, off:0};
  state.store.set(state.sid, 'paras', id, {o:(last ? last.o : 0) + 1024, x:'', at:Date.now(), by:state.uid});
}

    const nx = state.paras[state.order.get(pid) + 1]; if (nx){ e.preventDefault(); flushEdit(pid); mergeUp(nx.id); }
  }
});

function buildCSV(){
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const rows = [['行', 'シーン', '役名', 'セリフ', '状態', '最少テイク数', 'ファイル名', 'セリフ間違い'].map(q).join(',')];
  for (const p of state.paras){
    if (p.inf.type !== 'd') continue;
    const {cov} = coverage(p);
    let min = Infinity; for (let i = p.inf.d0; i < p.x.length; i++) if (countable(p, i)) min = Math.min(min, cov[i]);
    const ix = state.mIdx.get(p.id) || {t:[], e:[]};
    const files = [...new Set(ix.t.map(r => r.m.file || '(なし)'))];
    const errs = ix.e.map(r => `${p.x.slice(r.s, r.e)}${r.m.said ? '→' + r.m.said : ''}`);
    rows.push([p.no, p.scene, p.inf.sp, p.x.slice(p.inf.d0).replace(/\n/g, ' '), {done:'撮影完了', part:'途中', none:'未撮影'}[state.pstat.get(p.id)] || '', min === Infinity ? '' : min, files.join(' '), errs.join(' / ')].map(q).join(','));
  }
  return rows.join('\n');
}

/* ---------- remote activity ---------- */
async function announce(changes, col){
  if (!changes || !changes.length || col === 'paras') return;
  const docs = changes.map(c => c.doc).filter(Boolean);
  await resolveProfiles(docs.map(d => d.by));
  for (const c of changes.slice(0, 2)){
    const m = normMark(c.doc || {}, col); const s = m.segs && m.segs[0];
    const who = personName(m.by);
    const what = col === 'takes' ? (c.type === 'added' ? `${m.file || 'ファイル名なし'} を記録` : c.type === 'removed' ? 'テイクを取り消し' : 'テイクを修正') : (c.type === 'removed' ? 'セリフ間違いを削除' : 'セリフ間違いを記録');
    if (s){ const node = paper() && paper().querySelector(`.p[data-id="${s.p}"]`); if (node){ node.classList.remove('flash'); void node.offsetWidth; node.classList.add('flash'); } }
    toast(`${who}が${what}`, s ? {action:'見る', onAction: () => { const node = paper().querySelector(`.p[data-id="${s.p}"]`); node && node.scrollIntoView({block:'center', behavior:'smooth'}); }} : {});
  }
}

/* =====================================================================
   Firebase backend (独立したURLで配布するとき)
   FIREBASE_CONFIG に Firebase コンソールの設定値を貼ると、アカウント不要で
   誰でも開いて編集できるモードで動く。null のときは claude.ai 上で動く。
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC1l2tv5_pu16lUu036VdtGqGPF2QxCXYo",
  authDomain: "aigis-script.firebaseapp.com",
  databaseURL: "https://aigis-script-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "aigis-script",
  storageBucket: "aigis-script.firebasestorage.app",
  messagingSenderId: "336197933105",
  appId: "1:336197933105:web:552f32dc6fb82afa279d10"
};
const FB_VER = '10.12.2';
function avatarFor(name, color){
  const ch = esc((name || '?').trim().slice(0, 1) || '?');
  return 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="16" fill="${color}"/><text x="16" y="21.5" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#fff">${ch}</text></svg>`);
}
function colorFor(id){ let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return `hsl(${h % 360},55%,45%)`; }
async function firebaseBackend(cfg){
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [A, AU, FS, RT] = await Promise.all(['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js', 'firebase-database.js'].map(f => import(base + f)));
  const app = A.initializeApp(cfg);
  const auth = AU.getAuth(app);
  const uid = await new Promise((res, rej) => {
    const un = AU.onAuthStateChanged(auth, u => { if (u){ un(); res(u.uid); } });
    AU.signInAnonymously(auth).catch(e => { un(); rej(e); });
  });
  let fdb;
  try { fdb = FS.initializeFirestore(app, {localCache: FS.persistentLocalCache({tabManager: FS.persistentMultipleTabManager()})}); }
  catch(_){ fdb = FS.getFirestore(app); }
  const snapDoc = d => ({id:d.id, exists:d.exists(), data:() => d.data(), metadata:d.metadata});
  const docRef = path => { const r = FS.doc(fdb, path); return {
    id:r.id, path, get:() => FS.getDoc(r).then(snapDoc), set:d => FS.setDoc(r, d), update:d => FS.updateDoc(r, d), delete:() => FS.deleteDoc(r),
    onSnapshot:(n, e) => FS.onSnapshot(r, d => n(snapDoc(d)), e) }; };
  const colRef = (path, q = []) => { const c = FS.collection(fdb, path); const build = () => q.length ? FS.query(c, ...q) : c; return {
    path, orderBy:(f, d) => colRef(path, [...q, FS.orderBy(f, d || 'asc')]), where:(f, o, v) => colRef(path, [...q, FS.where(f, o, v)]),
    get:() => FS.getDocs(build()), onSnapshot:(n, e) => FS.onSnapshot(build(), n, e), doc:id => docRef(path + '/' + id) }; };
  const db = {doc:docRef, collection:colRef};

  /* 名前(アカウントの代わり) */
  const users = new Map();
  FS.onSnapshot(FS.collection(fdb, 'users'), s => {
    s.docs.forEach(d => users.set(d.id, d.data()));
    state.profiles = {}; if (state.sid){ renderHist(); } else renderHome(); renderPeers();
  }, () => {});
  const prof = id => { const u = users.get(id) || {}; const color = colorFor(id); return {id, name:u.name || '', color, avatarUrl:avatarFor(u.name, color), isMe:id === uid}; };
  const user = {
    id: async () => uid, me: async () => prof(uid), profiles: async ids => Object.fromEntries([].concat(ids).map(id => [id, prof(id)])),
    setName: name => FS.setDoc(FS.doc(fdb, 'users/' + uid), {name, at:Date.now()}, {merge:true}),
  };

  /* 参加者(Realtime Database: 読み書き回数の無料枠を使わない) */
  const rdb = RT.getDatabase(app);
  const connId = 'c' + newId();
  const myRef = RT.ref(rdb, 'presence/' + connId);
  let mine = {}, peers = [], connected = false;
  const peerCbs = new Set(), connCbs = new Set();
  const push = () => { if (connected) RT.set(myRef, {...mine, uid, at:RT.serverTimestamp()}).catch(() => {}); };
  RT.onValue(RT.ref(rdb, '.info/connected'), s => {
    connected = !!s.val();
    if (connected){ RT.onDisconnect(myRef).remove(); push(); }
    connCbs.forEach(f => f(connected));
  });
  RT.onValue(RT.ref(rdb, 'presence'), s => {
    const v = s.val() || {}, now = Date.now();
    peers = Object.entries(v).filter(([, p]) => p && now - (p.at || 0) < 8 * 60 * 1000 || 0).map(([k, p]) => ({
      peer:k, by:p.uid || null, isMe:p.uid === uid, sameTab:k === connId, kind:'viewer', guest:false, presence:p, updatedAt:p.at || now}));
    if (!peers.some(p => p.sameTab)) peers.push({peer:connId, by:uid, isMe:true, sameTab:true, kind:'viewer', guest:false, presence:{...mine, uid}, updatedAt:now});
    peerCbs.forEach(f => f({peers}));
  }, () => {});
  const room = {
    presence: async patch => { for (const [k, v] of Object.entries(patch)){ if (v === null || v === undefined) delete mine[k]; else mine[k] = v; } push(); },
    peers: () => peers,
    onPeers: (f) => { peerCbs.add(f); return () => peerCbs.delete(f); },
    onConnection: f => { connCbs.add(f); setTimeout(() => f(connected)); return () => connCbs.delete(f); },
  };
  return {db, user, room, uid};
}
function firebaseErrorMsg(e){
  const c = (e && e.code) || '';
  if (c === 'auth/operation-not-allowed' || c === 'auth/admin-restricted-operation') return 'Firebase の「匿名」ログインが有効になっていません。Firebase コンソールの Authentication で「匿名」を有効にしてください。';
  if (c.startsWith('auth/')) return 'Firebase にログインできませんでした(' + c + ')。';
  return 'Firebase に接続できませんでした。通信状態を確認してください。この端末だけで記録します。';
}
function askName(force){
  const cur = lsGet('aigis.name', '');
  if (cur && !force) return;
  const m = openModal(`<header><h2>あなたの名前</h2><p>記録した人として、ほかの参加者の画面に表示されます。</p></header>
    <div class="body"><div class="field"><label for="nmIn">名前(例: 山田・スクリプター)</label><input type="text" id="nmIn" maxlength="30" autocomplete="name"></div></div>
    <footer><button class="btn primary" type="button" id="nmOk">決定</button></footer>`);
  const inp = $('#nmIn', m); inp.value = cur; inp.focus();
  const ok = async () => {
    const v = inp.value.trim().slice(0, 30); if (!v){ inp.focus(); return; }
    lsSet('aigis.name', v); closeModal();
    try { await state.user.setName(v); } catch(_){}
  };
  $('#nmOk', m).onclick = ok;
  m.parentElement.onmousedown = null;
}

/* =====================================================================
   Routing & boot
   ===================================================================== */
function route(){ const m = /^script-([a-z0-9]+)$/.exec(location.hash.slice(1)); if (m) safeOpen(m[1]); else showHome(); }
window.addEventListener('hashchange', route);
function goHome(){ if (state.editing) flushAllEdits(); try { if (location.hash) location.hash = ''; } catch(_){} if (state.sid) showHome(); else renderHome(); }
$('#homeLink').addEventListener('click', e => { e.preventDefault(); goHome(); });
document.addEventListener('click', e => { const a = e.target.closest('a.btn[href="#"]'); if (a){ e.preventDefault(); goHome(); } });
window.addEventListener('beforeunload', () => { if (state.editing) flushAllEdits(); });

function use(name){
  const c = window.claude;
  if (!c || typeof c.use !== 'function') return Promise.resolve(null);
  return Promise.race([c.use(name).catch(() => null), sleep(10000).then(() => null)]);
}
async function boot(){
  renderSync();
  let db = null, user = null, room = null;
  if (FIREBASE_CONFIG){
    try { ({db, user, room} = await firebaseBackend(FIREBASE_CONFIG)); state.backend = 'firebase'; }
    catch(e){ console.error(e); toast(firebaseErrorMsg(e), {err:true, ms:20000}); }
  } else {
    [db, user, room] = await Promise.all([use('db'), use('user'), use('room')]);
  }
  state.user = user;
  if (user){ try { state.uid = await user.id(); } catch(_){} }
  if (state.backend === 'firebase'){
    const nm = lsGet('aigis.name', '');
    if (nm) user.setName(nm).catch(() => {}); else askName(true);
  }
  state.store = db ? CloudStore(db) : LocalStore();
  if (state.store.mode === 'cloud'){
    state.store.onPendingChange = renderSync;
    state.store.onWriteRefused = code => {
      if (code === 'invalid_argument' || code === 'permission-denied') toast('保存できませんでした。この台本を編集する権限がありません。', {err:true, ms:9000});
      else if (code === 'quota_exceeded') toast('保存容量の上限に達しました。古い台本を削除してください。', {err:true, ms:8000});
      else if (code === 'resource-exhausted') toast('今日の無料枠の上限に達したため保存できませんでした。日本時間の夕方(太平洋時間の0時)に回復します。', {err:true, ms:15000});
      else if (code === 'not-found') {}
      else toast('保存できませんでした。', {err:true});
    };
  }
  const scriptsTimer = setTimeout(() => { if (!state.scriptsReady){ state.scriptsReady = true; if (!state.sid) renderHome(); } }, 10000);
  state.store.watchScripts((list, md) => {
    if (!md || !md.fromCache || list.length){ state.scriptsReady = true; clearTimeout(scriptsTimer); }
    state.scripts = list;
    if (state.sid){
      const m = list.find(s => s.id === state.sid);
      if (m){ state.meta = m; const ti = $('#titleIn'); if (document.activeElement !== ti) ti.value = m.title; }
      if (state.scriptsReady && !m && state.meta){ toast('この台本は削除されました'); goHome(); }
    } else renderHome();
  }, () => { state.scriptsReady = true; if (!state.sid) renderHome(); });
  if (room){
    state.room = room;
    room.onPeers(() => renderPeers(), () => { state.room = null; $('#peers').hidden = true; });
    room.onConnection(c => { state.roomOn = c; renderSync(); });
    setPresence({sid:state.sid, t:Date.now()});
    setInterval(() => setPresence({t:Date.now()}), 120000);
  }
  renderSync(); route();
}
